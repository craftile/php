name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12', '13']
        include:
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        exclude:
          - php: '8.2'
            laravel: '13'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: |
          composer update \
            --with "illuminate/support:^${{ matrix.laravel }}.0" \
            --with "orchestra/testbench:^${{ matrix.testbench }}.0" \
            --prefer-dist --no-interaction --no-progress

      - name: Check composer autoload and class_exists
        run: |
          php -r 'require "vendor/autoload.php"; printf("class_exists: %s\n", (int)class_exists("Tests\\\\Core\\\\TestCase"));'

      - name: Run tests
        run: vendor/bin/pest --ci
